name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Take the version from the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Release tag '$TAG' is not a version like v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi
          deno run --allow-read --allow-write scripts/set-version.ts "$version"
          echo "Publishing $version"

      - name: Type-check, lint and format
        run: deno task check

      - name: Test
        run: deno task test

      - name: Publish to JSR
        run: deno publish --allow-dirty

  sync-version:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Write the released version into deno.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          deno run --allow-read --allow-write scripts/set-version.ts "$version"

          if git diff --quiet -- deno.json; then
            echo "deno.json is already at $version, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: set version to $version [skip ci]" -- deno.json
          git push
